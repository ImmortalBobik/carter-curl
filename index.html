<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Carter Curl</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main class="stage">
    <canvas id="sheet" aria-label="Carter Curl 3D curling against White Carter. Move the pointer or use arrow keys to set the broom, C to flip the curl, hold and release to throw, hold during the slide to sweep."></canvas>

    <div class="scoreboard" aria-live="polite">
      <div class="team team--carter">
        <span class="team-name">CARTER</span>
        <span id="score-carter" class="team-score">0</span>
      </div>
      <div class="end-block">
        <span id="end-label" class="end-label">END 1 / 3</span>
        <div class="pips">
          <span id="pips-carter" class="pip-row"></span>
          <span id="pips-white" class="pip-row"></span>
        </div>
      </div>
      <div class="team team--white">
        <span id="score-white" class="team-score">0</span>
        <span class="team-name">WHITE</span>
      </div>
    </div>

    <div id="inset-frame" class="inset-frame" hidden><span>HOUSE</span></div>

    <div id="banner" class="banner" aria-live="assertive"></div>

    <div id="power" class="power" hidden>
      <div class="power-track">
        <div id="power-fill" class="power-fill"></div>
        <span id="mk-hog" class="power-mark"><i>HOG</i></span>
        <span id="mk-tee" class="power-mark"><i>TEE</i></span>
        <span id="mk-back" class="power-mark"><i>BACK</i></span>
      </div>
    </div>

    <div id="hint" class="hint">MOVE TO AIM · C FLIPS CURL · HOLD &amp; RELEASE TO THROW</div>

    <button type="button" id="curl-btn" class="curl-btn" aria-label="Flip curl direction">
      <svg id="curl-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 12a8 8 0 1 1-3-6.2"></path>
        <polyline points="17 2 17 6 13 6"></polyline>
      </svg>
      <span id="curl-label">CURL LEFT</span>
    </button>

    <button type="button" id="mute-btn" class="mute-dot" aria-label="Mute sound" title="Toggle sound">
      <svg id="icon-on" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
      </svg>
      <svg id="icon-off" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="22" y1="9" x2="16" y2="15"></line>
        <line x1="16" y1="9" x2="22" y2="15"></line>
      </svg>
    </button>
  </main>
</body>
</html>
